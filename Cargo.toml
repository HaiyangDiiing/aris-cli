[package]
name = "aris-cli"
version = "0.3.3"
edition = "2021"
rust-version = "1.75"
authors = ["HaiyangDiiing"]
license = "MIT"
description = "ARIS CLI — Autonomous Research Iteration System. Track experiments, view results, and drive autonomous improvement loops across any AI coding agent."
readme = "README.md"
homepage = "https://github.com/HaiyangDiiing/aris-cli"
repository = "https://github.com/HaiyangDiiing/aris-cli"
keywords = ["aris", "autoresearch", "ai", "cli", "experiments"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "aris"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
owo-colors = "4"
directories = "5"
toml = "0.8"
csv = "1.3"
thiserror = "2"
dialoguer = "0.11"
fs2 = "0.4"
clap_complete = "4.5"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
